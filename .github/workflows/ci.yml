# Builds and tests every push. It never publishes: a jar reaches the Pack only through ~/.m2, and
# Modrinth and CurseForge, only from a maintainer's machine (docs/agents/releases.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Groundworks is taken from ~/.m2, which a runner starts without, so the version gradle.properties
      # names is built from its tag and published there, as its release does on a maintainer's machine.
      - id: groundworks
        run: echo "version=$(sed -n 's/^groundworks_version *= *//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: 5thlayer/groundworks
          ref: v${{ steps.groundworks.outputs.version }}
          path: .groundworks

      - run: ./gradlew publishToMavenLocal
        working-directory: .groundworks

      # Pipeworks, on every dev run, the same way from its tag.
      - id: pipeworks
        run: echo "version=$(sed -n 's/^pipeworks_version *= *//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: 5thlayer/pipeworks
          ref: pipeworks-v${{ steps.pipeworks.outputs.version }}
          path: .pipeworks

      - run: ./gradlew publishToMavenLocal
        working-directory: .pipeworks

      # The build, with the JUnit tests.
      - run: ./gradlew build

      # A headless server that runs the game tests and names each one; it fails if it ran none.
      - run: ./gradlew runGameTestServer

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report
          path: |
            build/reports/gametest.xml
            build/reports/tests/
            run/gametest/logs/
          if-no-files-found: ignore

  # The upload step's tests, against a stand-in server on localhost. They contact no site.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover scripts/tests

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
