modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Mod's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# Records which mouse button pressed EMI's Fill Recipe (ADR-0004). Not required: a pack without EMI has
# nothing for it to apply to.
[[mixins]]
config = "craftworks.emi.mixins.json"
