modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Mod's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# The Assemblers stand on its footprint and swap tiers by its Fast Replace (#21). Not jar-in-jar: the Mod and
# the other mods on Groundworks share one copy (FactoryWorks ADR-0115). The range runs from the Groundworks
# the Mod is compiled against up to the next minor, 0.6, which moves when the Mod takes it.
[[dependencies.${mod_id}]]
modId = "groundworks"
type = "required"
versionRange = "${groundworks_range}"
ordering = "NONE"
side = "BOTH"

# libworks-runtime, nested by jar-in-jar: it registers the Works creative tab, and the Assembler's screen shows
# what its empty slots take as its Ghosts.
# The range is the one libworks { runtime } in build.gradle nests, to the next minor.
[[dependencies.${mod_id}]]
modId = "libworks"
type = "required"
versionRange = "${libworks_runtime_range}"
ordering = "NONE"
side = "BOTH"

# Scripts get an Assembling recipe schema and a lock event (#11). Not required: Craftworks works without it,
# and its plugin is only loaded by KubeJS. The range is the KubeJS the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "kubejs"
type = "optional"
versionRange = "[26.1.2-8.0.3,)"
ordering = "NONE"
side = "BOTH"

# A JEI category for Assembling recipes and a recipe button that queues on the Assembler (#12). Not
# required: its plugin is only loaded by JEI. The range is the JEI the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[29.20.0.53,)"
ordering = "NONE"
side = "CLIENT"

# An EMI category for Assembling recipes, and its Fill Recipe queueing on the Personal Assembler (ADR-0004)
# and the Assemblers. Not required: a client needs EMI or JEI (ADR-0009), and NeoForge can't require one of
# two; its plugin is only loaded by EMI, and its mixins have nothing to apply to without it. The range is the
# EMI the plugin is compiled against, the 26.1 unofficial port's 1.1.24, so an older EMI refuses to load
# beside the Mod.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1.24,)"
ordering = "NONE"
side = "CLIENT"

# Shows an Assembler's Held recipe, state and energy, and the Creative Energy Source's Infinite FE, in its
# tooltip (#28). Not required: its plugin is only loaded by Jade. The range is the Jade the plugin is compiled
# against.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"

# Its pipes fill and drain the Fluid Connections and draw an arm toward one while it exists (Pipeworks
# #11). Not required: the Mod names no Pipeworks type, and a connection reaches any tank or pipe through the
# fluid capability. The range runs from the Pipeworks that draws the arm, with no upper bound: the Mod
# compiles against none of it, so a later Pipeworks can't break it.
[[dependencies.${mod_id}]]
modId = "pipeworks"
type = "optional"
versionRange = "${pipeworks_range}"
ordering = "NONE"
side = "BOTH"

# Removes the inventory's 2x2 crafting grid, keeping its slots (ADR-0007).
[[mixins]]
config = "craftworks.mixins.json"

# Records which mouse button pressed EMI's Fill Recipe (ADR-0004). Not required: a pack without EMI has
# nothing for it to apply to, and its plugin skips, with an error, any mixin whose EMI method is gone.
[[mixins]]
config = "craftworks.emi.mixins.json"

# Lets the Assembler's JEI recipe button take a right and a middle click (#12). Not required: a pack
# without JEI has nothing for it to apply to.
[[mixins]]
config = "craftworks.jei.mixins.json"
