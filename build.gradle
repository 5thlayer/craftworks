plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = maven_group
version = mod_version
base.archivesName = archives_name

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

// The Minecraft version goes in the jar's name and not in the Mod's version: craftworks-26.1.2-0.1.0.jar.
tasks.withType(Jar).configureEach {
    archiveVersion = "$minecraft_version-$mod_version"
}

def gameTestReport = layout.buildDirectory.file('reports/gametest.xml').get().asFile

// EMI for 26.1: the unofficial port.
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'

repositories {
    // EMI for 26.1 is an unofficial port, published on CurseForge only; Groundworks is taken from there too.
    maven { url = 'https://cursemaven.com' }
    // KubeJS and Rhino, its script engine.
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' }
    }
    // JEI.
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

// JEI for 26.1.2. 29.20.0.53 is the last that runs on NeoForge 26.1.2.77; later ones ask for .81 and up.
def jei = '29.20.0.53'

// KubeJS for 26.1. Compiled against for its plugin (compat/kubejs), which only KubeJS ever loads.
// 8.0.3 is the last that runs on NeoForge 26.1.2.77; later ones ask for .84. Rhino is the one it names.
def kubejs = 'dev.latvian.mods:kubejs-neoforge:26.1.2-8.0.3'
def rhino = 'dev.latvian.mods:rhino:2101.2.7-build.85'

neoForge {
    version = neoforge_version

    runs {
        // EMI's 26.1 port still carries @OnlyIn, and a dev run halts on a warning screen over it that
        // production never shows.
        configureEach {
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
        // The same player every launch, so a dev save keeps its inventory and position.
        client {
            client()
            programArguments.addAll '--username', 'Developer', '--uuid', '123456781234123412341234567890ab'
            // -PquickPlay=<save> opens that save straight from launch (the skillworks:quicklaunch skill).
            programArguments.addAll providers.gradleProperty('quickPlay').map { ['--quickPlaySingleplayer', it] }.orElse([])
            // -PdevLockReason=<recipe id> locks that recipe with a reason, to see one on the Crafting Plan (#18).
            if (providers.gradleProperty('devLockReason').isPresent()) {
                systemProperty 'craftworks.devLockReason', providers.gradleProperty('devLockReason').get()
            }
        }
        // Runs the Mod's game tests headless and exits, non-zero if any fails. 26.1 has no
        // namespace property, so the selector is what keeps vanilla's tests out.
        // A directory of its own, so nothing the dev client loads or saves reaches it.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            programArguments.addAll '--tests', "${mod_id}:*", '--report', gameTestReport.absolutePath
            // The recipes only the game tests read, a datapack in the jar that only this run turns on.
            systemProperty 'craftworks.gametestPack', 'true'
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

// The server says only how many tests passed, so the report is read back to name them: a green
// run that didn't run a test is no evidence for it. The report, not the exit code, decides, so a
// failing run still names its tests; a server that crashes writes no report and fails here too.
// The server writes the report but not its folder, which a clean checkout has yet to make.
tasks.named('runGameTestServer') {
    ignoreExitValue = true
    doFirst {
        gameTestReport.delete()
        gameTestReport.parentFile.mkdirs()
    }
    doLast {
        if (!gameTestReport.exists()) throw new GradleException("The game test server wrote no report at $gameTestReport")
        def cases = new groovy.xml.XmlSlurper().parse(gameTestReport).'**'.findAll { it.name() == 'testcase' }
        if (cases.isEmpty()) throw new GradleException('The game test server ran no tests')
        cases.each { logger.lifecycle("${it.failure.size() ? 'FAILED' : 'passed'}  ${it.@name}") }
        def failed = cases.count { it.failure.size() }
        if (failed) throw new GradleException("$failed of ${cases.size()} game tests failed")
    }
}

// The built-in vanilla pack (#9): vanilla's crafting recipes as Assembling recipes at their own ids,
// generated from the game jar and never written by hand. Shaped and shapeless recipes are read as bags
// of ingredients; every other type, the special recipes and transmutes among them, has no fixed bag and
// result and stays at the crafting table.
def vanillaPackDir = layout.buildDirectory.dir('generated/vanillaPack')
def generateVanillaPack = tasks.register('generateVanillaPack') {
    def gameJar = tasks.named('createMinecraftArtifacts').flatMap { it.gameJarArtifact }
    inputs.file gameJar
    outputs.dir vanillaPackDir
    doLast {
        def root = vanillaPackDir.get().dir('vanilla_pack').asFile
        project.delete(root)
        def recipes = new File(root, 'data/minecraft/recipe')
        recipes.mkdirs()
        def slurper = new groovy.json.JsonSlurper()
        def converted = 0
        new java.util.zip.ZipFile(gameJar.get().asFile).withCloseable { zip ->
            zip.entries().findAll { !it.directory && it.name ==~ 'data/minecraft/recipe/.+\\.json' }.each { entry ->
                def recipe = slurper.parse(zip.getInputStream(entry), 'UTF-8')
                List<Object> slots
                switch (recipe.type) {
                    case 'minecraft:crafting_shapeless':
                        slots = recipe.ingredients
                        break
                    case 'minecraft:crafting_shaped':
                        slots = recipe.pattern.join('').toList().findAll { it != ' ' }.collect { recipe.key[it] }
                        break
                    default:
                        return
                }
                // One entry per distinct ingredient, counted: a bag, not a grid.
                def bag = new LinkedHashMap<String, Map>()
                slots.each { slot ->
                    def key = groovy.json.JsonOutput.toJson(slot)
                    def sized = bag.computeIfAbsent(key) { [ingredient: slot, count: 0] }
                    sized.count++
                }
                def assembling = [type: 'craftworks:assembling', ingredients: bag.values() as List, result: recipe.result]
                def file = new File(recipes, entry.name.substring('data/minecraft/recipe/'.length()))
                file.parentFile.mkdirs()
                file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(assembling)) + '\n'
                converted++
            }
        }
        if (converted == 0) throw new GradleException('No vanilla crafting recipes found in ' + gameJar.get().asFile)
        new File(root, 'pack.mcmeta').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                [pack: [description: 'Craftworks: vanilla crafting as Assembling recipes', min_format: [101, 1], max_format: [101, 1]]])) + '\n'
        logger.lifecycle("Built-in vanilla pack: $converted recipe(s) converted")
    }
}
sourceSets.main.resources.srcDir(files(vanillaPackDir).builtBy(generateVanillaPack))

// Mods on the dev runs that the published jar does not depend on.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

// The Groundworks the Assemblers' footprint and Fast Replace are compiled against, and the least the Mod
// accepts at load (neoforge.mods.toml): 0.5.2, CurseForge file 9049565. Its maven is the local one only
// (5thlayer/groundworks#2), which CI has not got, so it comes from CurseForge through Cursemaven.
def groundworks = 'curse.maven:groundworks-1717892:9049565'

dependencies {
    // Required, and never jar-in-jar: the Mod, Wireworks and the Pack share one Groundworks (FactoryWorks ADR-0115).
    implementation groundworks

    // EMI is optional to players, and on every dev run so its Assembling category can be looked at.
    // -PwithJEI puts JEI on the dev runs in its place (#12): a pack ships one viewer, not both.
    compileOnly 'curse.maven:emi-unofficial-port-1544558:8630349'
    if (providers.gradleProperty('withJEI').isPresent()) {
        localRuntime "mezz.jei:jei-26.1.2-neoforge:$jei"
    } else {
        localRuntime 'curse.maven:emi-unofficial-port-1544558:8630349'
    }

    // JEI is optional to players too (#12). Its API, which only its plugin (compat/jei) names.
    compileOnly "mezz.jei:jei-26.1.2-common-api:$jei"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:$jei"

    // DataFixerUpper, and only that: `Codec` is Mojang's serialisation library, not a Minecraft type,
    // so the planner's codecs round-trip on a plain JVM. Minecraft stays off the test classpath, which
    // keeps the planner core free of it. The version is the one Minecraft 26.1.2 ships.
    testImplementation 'com.mojang:datafixerupper:9.0.19'

    // KubeJS is optional to players (#11). Its jar and Rhino, which the plugin's event types extend.
    compileOnly(kubejs) { transitive = false }
    compileOnly(rhino) { transitive = false }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Researchd on the dev runs, only with -PwithResearchd, to try the researchd Lock source for real
// (ADR-0010). Its jar is in no public maven, only the local one its own build publishes to, so a clean
// checkout and CI never ask for it. Porting-Dead-Libs, which it requires, comes with it.
if (providers.gradleProperty('withResearchd').isPresent()) {
    repositories {
        mavenLocal {
            // Porting-Dead-Libs is there as a bare jar, with no pom beside it.
            metadataSources { mavenPom(); gradleMetadata(); artifact() }
            content {
                includeGroup 'com.portingdeadmods.researchd'
                includeGroup 'com.github.Porting-Dead-Mods'
            }
        }
    }
    dependencies {
        localRuntime 'com.portingdeadmods.researchd:researchd:1.3.4-26.1'
    }
}

// KubeJS on the dev runs, only with -PwithKubeJS, to try the recipe schema and the lock event for real
// (#11). The sample scripts in kubejs/ are copied into each run's game directory, so the client and the
// game tests read the same ones; the game tests then run the KubeJS tests too.
if (providers.gradleProperty('withKubeJS').isPresent()) {
    dependencies {
        // Its gif and web-server libraries ride inside its jar, and the gif one is on no maven here.
        localRuntime(kubejs) { exclude group: 'com.github.rtyley'; exclude group: 'dev.latvian.apps' }
    }
    neoForge.runs.configureEach {
        systemProperty 'craftworks.kubejsTests', 'true'
    }
    // The game tests also get kubejs_gametest/, the scripts only they read.
    def copyKubeJSScripts = { String name, String gameDir, List<String> sources ->
        tasks.register(name, Copy) {
            from sources
            into "$gameDir/kubejs"
        }
    }
    def toClient = copyKubeJSScripts('copyKubeJSScriptsToClient', 'run', ['kubejs'])
    def toGameTests = copyKubeJSScripts('copyKubeJSScriptsToGameTests', 'run/gametest', ['kubejs', 'kubejs_gametest'])
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn toClient }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn toGameTests }
}

test {
    useJUnitPlatform()
}

// The jar is what players are handed, so it carries the MIT licence the Mod is under.
def jarLicensing = ['LICENSE', 'LICENSES/MIT.txt']
tasks.named('jar', Jar) {
    from(rootDir) { include jarLicensing }
}

// Fails the build when the jar lost its licensing.
def checkJarLicensing = tasks.register('checkJarLicensing') {
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file jarFile
    doLast {
        def names = new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip -> zip.entries()*.name as Set }
        def missing = jarLicensing.findAll { !names.contains(it) }
        if (missing) throw new GradleException("${jarFile.get().asFile.name} lacks its licensing: ${missing.join(', ')}")
    }
}
tasks.named('check') { dependsOn checkJarLicensing }

// neoforge.mods.toml names nothing of its own: it is filled from gradle.properties.
def modProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_description: mod_description, version: mod_version,
        minecraft_version: minecraft_version, neoforge_version: neoforge_version,
]
processResources {
    inputs.properties modProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modProperties
    }
}

// Maven local only, which is where the Pack pins the Mod's jar (release-train).
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

// A version in the local maven repository never changes: the Pack pins it and compares its sha256, so
// a fix is the next patch version (docs/agents/releases.md). Gradle's own mavenLocal() says where that
// is, and it's removed again so nothing resolves from it.
tasks.withType(PublishToMavenLocal).configureEach {
    def local = repositories.mavenLocal()
    repositories.remove(local)
    def published = new File(local.url.path, "${maven_group.replace('.', '/')}/$archives_name/$mod_version")
    doFirst {
        if (published.exists()) throw new GradleException(
                "$mod_name $mod_version is already in $published, and a published version never changes: bump mod_version")
    }
}
