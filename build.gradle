// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing and the release and upload tasks come from the libworks convention plugin (libworks ADR 0003).
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.2.0'
}

// What the Mod requires of the other Libraries, each as a range whose lower bound is a released version:
// the one the Mod is built and run against and the one CI builds from its tag. neoforge.mods.toml names each as ${<name>_range}.
libworks {
    // Craftworks' own tags are v<version>.
    tagPrefix = 'v'
    // Required, and never jar-in-jar: the Mod and the other mods on Groundworks share one copy (FactoryWorks
    // ADR-0115). Capped below the next minor, 0.6, which moves when the Mod takes it.
    upstream('groundworks') {
        // Groundworks' tags are v<version> too.
        tagPrefix = 'v'
        range = '[0.5.5,0.6)'
    }
    // Optional to players, and on the dev client so a Fluid Connection can be tried against its pipes, which
    // draw an arm toward one from 0.2.0 (Pipeworks #11). The Mod names no Pipeworks type: a pipe reaches a
    // connection through the fluid capability alone, so a later Pipeworks can't break it.
    upstream('pipeworks') {
        optional = true
        range = '[0.2.0,)'
    }
    // Nested by jar-in-jar, so players install nothing more; FML loads the newest nested copy in range,
    // which runs to the next minor. The Assembler's ghosts are its Ghosts (#52).
    runtime = '0.1.1'
}

// EMI for 26.1: the unofficial port.
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'

repositories {
    // EMI for 26.1 is an unofficial port, published on CurseForge only.
    maven { url = 'https://cursemaven.com' }
    // Groundworks, Pipeworks and libworks-runtime, from the local maven only, where their releases publish them the moment
    // they are cut, with no site's review to wait on. CI builds their tags there first.
    exclusiveContent {
        forRepository { mavenLocal() }
        filter {
            includeModule 'io.github.5thlayer', 'groundworks'
            includeModule 'io.github.5thlayer', 'pipeworks'
            includeModule 'io.github.5thlayer', 'libworks-runtime'
        }
    }
    // KubeJS and Rhino, its script engine.
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' }
    }
    // JEI.
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    // Jade.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// JEI for 26.1.2. 29.20.0.53 is the last that runs on NeoForge 26.1.2.77; later ones ask for .81 and up.
def jei = '29.20.0.53'

// Jade for 26.1.2. Built on NeoForge 26.1.2.76, so it runs on our .77.
def jade = 'maven.modrinth:jade:26.1.11+neoforge'

// KubeJS for 26.1. Compiled against for its plugin (compat/kubejs), which only KubeJS ever loads.
// 8.0.3 is the last that runs on NeoForge 26.1.2.77; later ones ask for .84. Rhino is the one it names.
def kubejs = 'dev.latvian.mods:kubejs-neoforge:26.1.2-8.0.3'
def rhino = 'dev.latvian.mods:rhino:2101.2.7-build.85'

// Mods on the dev client that the published jar does not depend on. The game tests run on a source set
// of their own, with no code and the Mod's dependencies but not these, so they prove the Mod plays alone
// on Groundworks (ADR-0127).
sourceSets {
    solo
}

configurations {
    soloRuntimeOnly.extendsFrom implementation, runtimeOnly
}

neoForge {
    runs {
        // EMI's 26.1 port still carries @OnlyIn, and a dev run halts on a warning screen over it that
        // production never shows.
        configureEach {
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
        client {
            // -PdevLockReason=<recipe id> locks that recipe with a reason, to see one on the Crafting Plan (#18).
            if (providers.gradleProperty('devLockReason').isPresent()) {
                systemProperty 'craftworks.devLockReason', providers.gradleProperty('devLockReason').get()
            }
        }
        gameTestServer {
            sourceSet = sourceSets.solo
            // Marks this run as the Mod's own, which is when it registers its test tank and fluids.
            systemProperty 'craftworks.gametest', 'true'
        }
    }

    addModdingDependenciesTo sourceSets.solo
}

tasks.named('runGameTestServer') {
    doFirst {
        // The tests read the defaults: a config an earlier run wrote would keep the categories it listed then.
        neoForge.runs.gameTestServer.gameDirectory.file('config/craftworks-server.toml').get().asFile.delete()
    }
}

// The built-in vanilla pack (#9): vanilla's crafting recipes as Assembling recipes at their own ids,
// generated from the game jar and never written by hand. Shaped and shapeless recipes are read as bags
// of ingredients; every other type, the special recipes and transmutes among them, has no fixed bag and
// result and stays at the crafting table.
def vanillaPackDir = layout.buildDirectory.dir('generated/vanillaPack')
def generateVanillaPack = tasks.register('generateVanillaPack') {
    def gameJar = tasks.named('createMinecraftArtifacts').flatMap { it.gameJarArtifact }
    inputs.file gameJar
    outputs.dir vanillaPackDir
    doLast {
        def root = vanillaPackDir.get().dir('vanilla_pack').asFile
        project.delete(root)
        def recipes = new File(root, 'data/minecraft/recipe')
        recipes.mkdirs()
        def slurper = new groovy.json.JsonSlurper()
        def converted = 0
        new java.util.zip.ZipFile(gameJar.get().asFile).withCloseable { zip ->
            zip.entries().findAll { !it.directory && it.name ==~ 'data/minecraft/recipe/.+\\.json' }.each { entry ->
                def recipe = slurper.parse(zip.getInputStream(entry), 'UTF-8')
                List<Object> slots
                switch (recipe.type) {
                    case 'minecraft:crafting_shapeless':
                        slots = recipe.ingredients
                        break
                    case 'minecraft:crafting_shaped':
                        slots = recipe.pattern.join('').toList().findAll { it != ' ' }.collect { recipe.key[it] }
                        break
                    default:
                        return
                }
                // One entry per distinct ingredient, counted: a bag, not a grid.
                def bag = new LinkedHashMap<String, Map>()
                slots.each { slot ->
                    def key = groovy.json.JsonOutput.toJson(slot)
                    def sized = bag.computeIfAbsent(key) { [ingredient: slot, count: 0] }
                    sized.count++
                }
                def assembling = [type: 'craftworks:assembling', ingredients: bag.values() as List, results: [recipe.result]]
                def file = new File(recipes, entry.name.substring('data/minecraft/recipe/'.length()))
                file.parentFile.mkdirs()
                file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(assembling)) + '\n'
                converted++
            }
        }
        if (converted == 0) throw new GradleException('No vanilla crafting recipes found in ' + gameJar.get().asFile)
        new File(root, 'pack.mcmeta').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                [pack: [description: 'Craftworks: vanilla crafting as Assembling recipes', min_format: [101, 1], max_format: [101, 1]]])) + '\n'
        logger.lifecycle("Built-in vanilla pack: $converted recipe(s) converted")
    }
}
sourceSets.main.resources.srcDir(files(vanillaPackDir).builtBy(generateVanillaPack))

dependencies {
    // EMI is optional to players, and on the dev client so its Assembling category can be looked at.
    // -PwithJEI puts JEI on the dev client in its place (#12): a pack ships one viewer, not both.
    compileOnly 'curse.maven:emi-unofficial-port-1544558:8630349'
    if (providers.gradleProperty('withJEI').isPresent()) {
        localRuntime "mezz.jei:jei-26.1.2-neoforge:$jei"
    } else {
        localRuntime 'curse.maven:emi-unofficial-port-1544558:8630349'
    }

    // JEI is optional to players too (#12). Its API, which only its plugin (compat/jei) names.
    compileOnly "mezz.jei:jei-26.1.2-common-api:$jei"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:$jei"

    // DataFixerUpper, and only that: `Codec` is Mojang's serialisation library, not a Minecraft type,
    // so the planner's codecs round-trip on a plain JVM. Minecraft stays off the test classpath, which
    // keeps the planner core free of it. The version is the one Minecraft 26.1.2 ships.
    testImplementation 'com.mojang:datafixerupper:9.0.19'

    // Jade is optional to players too (#28), and on the dev client so what it shows can be looked at. Its API,
    // which only its plugin (compat/jade) names.
    compileOnly jade
    localRuntime jade

    // KubeJS is optional to players (#11). Its jar and Rhino, which the plugin's event types extend.
    compileOnly(kubejs) { transitive = false }
    compileOnly(rhino) { transitive = false }
}

// Researchd on the dev runs, only with -PwithResearchd, to try the researchd Lock source for real
// (ADR-0010). Its jar is in no public maven, only the local one its own build publishes to, so a clean
// checkout and CI never ask for it. Porting-Dead-Libs, which it requires, comes with it.
if (providers.gradleProperty('withResearchd').isPresent()) {
    repositories {
        mavenLocal {
            // Porting-Dead-Libs is there as a bare jar, with no pom beside it.
            metadataSources { mavenPom(); gradleMetadata(); artifact() }
            content {
                includeGroup 'com.portingdeadmods.researchd'
                includeGroup 'com.github.Porting-Dead-Mods'
            }
        }
    }
    dependencies {
        localRuntime 'com.portingdeadmods.researchd:researchd:1.3.4-26.1'
        soloRuntimeOnly 'com.portingdeadmods.researchd:researchd:1.3.4-26.1'
    }
}

// KubeJS on the dev runs, only with -PwithKubeJS, to try the recipe schema and the lock event for real
// (#11). The sample scripts in kubejs/ are copied into each run's game directory, so the client and the
// game tests read the same ones; the game tests then run the KubeJS tests too.
if (providers.gradleProperty('withKubeJS').isPresent()) {
    dependencies {
        // Its gif and web-server libraries ride inside its jar, and the gif one is on no maven here.
        localRuntime(kubejs) { exclude group: 'com.github.rtyley'; exclude group: 'dev.latvian.apps' }
        soloRuntimeOnly(kubejs) { exclude group: 'com.github.rtyley'; exclude group: 'dev.latvian.apps' }
    }
    neoForge.runs.configureEach {
        systemProperty 'craftworks.kubejsTests', 'true'
    }
    // The game tests also get kubejs_gametest/, the scripts only they read.
    def copyKubeJSScripts = { String name, String gameDir, List<String> sources ->
        tasks.register(name, Copy) {
            from sources
            into "$gameDir/kubejs"
        }
    }
    def toClient = copyKubeJSScripts('copyKubeJSScriptsToClient', 'run', ['kubejs'])
    def toGameTests = copyKubeJSScripts('copyKubeJSScriptsToGameTests', 'run/gametest', ['kubejs', 'kubejs_gametest'])
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn toClient }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn toGameTests }
}
