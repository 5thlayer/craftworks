# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the libworks plugin's scripts read the Mod's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too.
mod_id = craftworks
mod_name = Craftworks
mod_description = Factorio-style automated crafting: a Personal Assembler that plans every intermediate, plus FE-powered Assemblers and an electric Refiner.
mod_version = 0.11.6
maven_group = io.github.5thlayer
archives_name = craftworks

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77

# Modrinth and CurseForge (docs/agents/releases.md). The dependencies are the required ones, comma
# separated: Modrinth project ids, CurseForge slugs. EMI, since a client needs EMI or JEI and neither
# site can name one of two (#69, releases.md), and Groundworks, which the Assemblers stand on (#21), a required mod
# and never jar-in-jar (FactoryWorks ADR-0115). On CurseForge the EMI slug is the unofficial 26.1 port's
# (project 1544558, the one build.gradle compiles against), never official EMI's `emi`: that project has no
# 26.1 file, and the CurseForge app fills a required relation with the newest file the project has, so it
# installed EMI's 1.21.1 jar into 26.1.2 packs beside their real EMI and re-added it after every delete. upload_release_type is release, beta or alpha for every upload,
# or empty for beta below 1.0 and release from it; CurseForge's app lists a project only once it has a
# release.
modrinth_project_id = v6CdwRwB
curseforge_project_id = 1715876
modrinth_dependencies = fRiHVvU7,AJ3Q7hSr
curseforge_dependencies = emi-unofficial-port-unstable,groundworks
upload_release_type =
