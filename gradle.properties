# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the scripts read the Mod's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too.
mod_id = craftworks
mod_name = Craftworks
mod_description = The Personal Assembler: ask for an item, and every intermediate is planned, the whole cost is paid up front, and the crafts run one after another over time.
mod_version = 0.4.0
maven_group = io.github.5thlayer
archives_name = craftworks

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77
# The Groundworks the Mod is compiled against and the least it accepts at load (neoforge.mods.toml),
# taken from ~/.m2. CI builds this version's tag into its own ~/.m2 first (.github/workflows/ci.yml).
groundworks_version = 0.5.4

# Modrinth and CurseForge (docs/agents/releases.md). The dependencies are the required ones, comma
# separated: Modrinth project ids, CurseForge slugs. EMI, since the Assembler takes its requests through
# EMI's Fill Recipe, and Groundworks, which the Assemblers stand on (#21), a required mod and never
# jar-in-jar (FactoryWorks ADR-0115). upload_release_type is release, beta or alpha for every upload,
# or empty for beta below 1.0 and release from it; CurseForge's app lists a project only once it has a
# release.
modrinth_project_id = v6CdwRwB
curseforge_project_id = 1715876
modrinth_dependencies = fRiHVvU7,AJ3Q7hSr
curseforge_dependencies = emi,groundworks
upload_release_type =
